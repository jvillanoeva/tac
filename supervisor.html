<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <title>Supervisor — Colectivo</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .sup-page { max-width: 1000px; margin: 0 auto; padding: 20px 16px 80px; }
    .sup-header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    .sup-header h1 { font-size: 1.25rem; }
    .sup-meta { color: var(--text-secondary); font-size: 13px; }
    .kpis { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--border); border-radius: var(--radius-lg); margin: 16px 0; overflow: hidden; }
    .kpi { flex: 1; min-width: 110px; padding: 10px 16px; border-right: 1px solid var(--border); }
    .kpi:last-child { border-right: 0; }
    .kpi .n { font-size: 1.35rem; font-weight: 700; }
    .kpi .l { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-top: 2px; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .toolbar input { flex: 1; min-width: 200px; padding: 8px 11px; font-size: 13px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary); }
    .toolbar .right { margin-left: auto; color: var(--text-muted); font-size: 12px; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th { text-align: left; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; padding: 7px 10px; border-bottom: 1px solid var(--border); }
    .tbl th.r, .tbl td.r { text-align: right; }
    .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .trow { cursor: pointer; }
    .trow:hover { background: var(--bg-card); }
    .code { font-weight: 700; }
    .kind { color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
    .mgr { color: var(--text-secondary); }
    .mgr.none { color: var(--text-muted); font-style: italic; }
    .nomail { color: var(--warning); font-size: 11px; }
    .minibar { display: inline-block; width: 60px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; vertical-align: middle; margin-right: 6px; }
    .minibar > i { display: block; height: 100%; background: var(--text-muted); }
    .badge { display: inline-block; min-width: 26px; text-align: center; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 3px; }
    .b-gate { background: color-mix(in srgb, var(--success) 22%, transparent); color: var(--success); }
    .b-table { background: color-mix(in srgb, #3b82f6 24%, transparent); color: #60a5fa; }
    .b-zero { color: var(--text-muted); }
    .guests { background: var(--bg-card); }
    .guests td { padding: 0; }
    .glist { width: 100%; border-collapse: collapse; font-size: 12px; }
    .glist td { padding: 4px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .glist td.n { color: var(--text-muted); width: 30px; }
    .dot { display:inline-block; width: 22px; text-align:center; }
    .dot.on-g { color: var(--success); } .dot.on-t { color: #60a5fa; } .dot.off { color: var(--text-muted); }
    .btn-sm { font-size: 12px; padding: 7px 12px; }
    #send-result { font-size: 12px; color: var(--text-secondary); margin-top: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="sup-page">
    <div class="sup-header">
      <a href="/dashboard.html" class="nav-brand" style="display:block;">COLECTIVO</a>
      <h1 id="event-name">Supervisor</h1>
      <span class="sup-meta" id="event-meta"></span>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="toolbar">
      <input id="q" placeholder="Buscar mesa o titular…">
      <label style="font-size:12px;color:var(--text-secondary);display:flex;gap:5px;align-items:center;">
        <input type="checkbox" id="incomplete"> sólo incompletas
      </label>
      <button class="btn btn-secondary btn-sm" onclick="load()">Actualizar</button>
      <button class="btn btn-sm" id="send-btn" onclick="sendUndistributed()">Enviar pases faltantes a titulares</button>
      <span class="right" id="count"></span>
    </div>
    <div id="send-result"></div>

    <table class="tbl">
      <thead><tr>
        <th>Mesa</th><th>Titular</th>
        <th class="r">Cargados</th><th class="r">Puerta</th><th class="r">Mesa</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/api.js"></script>
  <script>
    Auth.init(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    API.init(CONFIG.API_URL);

    const slug = new URLSearchParams(window.location.search).get('slug');
    if (!slug) window.location.href = '/dashboard.html';

    let tables = [];
    let query = '';
    let onlyIncomplete = false;
    const expanded = new Set();

    async function init() {
      await Auth.requireSession();
      try {
        const event = await API.get(`/api/events/${slug}`);
        document.getElementById('event-name').textContent = event.name + ' — Supervisor';
        document.getElementById('event-meta').textContent =
          [event.date_label, event.venue].filter(Boolean).join(' · ');
      } catch (e) {
        document.getElementById('event-name').textContent = 'Error: ' + e.message;
      }
      await load();
      setInterval(load, 25000); // light auto-refresh
    }

    async function load() {
      try {
        const data = await API.get(`/api/events/${slug}/invite-links/scan-status`);
        tables = data.tables || [];
        render();
      } catch (e) {
        document.getElementById('tb').innerHTML =
          `<tr><td colspan="5" style="color:var(--danger);padding:20px;">${e.message}</td></tr>`;
      }
    }

    function kpis() {
      const t = tables.length;
      const loaded = tables.reduce((a, x) => a + x.counts.loaded, 0);
      const quota = tables.reduce((a, x) => a + (x.max_guests || 0), 0);
      const gate = tables.reduce((a, x) => a + x.counts.gate, 0);
      const tbl = tables.reduce((a, x) => a + x.counts.table, 0);
      const noMail = tables.filter(x => !x.manager_email).length;
      document.getElementById('kpis').innerHTML = [
        [t, 'mesas'], [quota, 'cupo'], [loaded, 'cargados'],
        [gate, 'puerta'], [tbl, 'mesa'], [noMail, 'sin correo titular'],
      ].map(([n, l]) => `<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
    }

    function filtered() {
      return tables.filter(x => {
        if (onlyIncomplete && x.counts.loaded >= x.max_guests) return false;
        if (query) {
          const q = query.toLowerCase();
          if (!(x.label || '').toLowerCase().includes(q) && !(x.manager_name || '').toLowerCase().includes(q)) return false;
        }
        return true;
      });
    }

    function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    function render() {
      kpis();
      const list = filtered();
      document.getElementById('count').textContent = `${list.length} / ${tables.length}`;
      const rows = list.map(x => {
        const pct = x.max_guests ? Math.round(x.counts.loaded / x.max_guests * 100) : 0;
        const gate = x.counts.gate ? `<span class="badge b-gate">${x.counts.gate}</span>` : `<span class="badge b-zero">0</span>`;
        const tbl = x.counts.table ? `<span class="badge b-table">${x.counts.table}</span>` : `<span class="badge b-zero">0</span>`;
        let html = `<tr class="trow" onclick="toggle('${x.id}')">
          <td><span class="code">${esc(x.label)}</span></td>
          <td>${x.manager_name ? `<span class="mgr">${esc(x.manager_name)}</span>` : '<span class="mgr none">sin titular</span>'}
              ${x.manager_email ? '' : '<span class="nomail"> · sin correo</span>'}</td>
          <td class="r"><span class="minibar"><i style="width:${pct}%"></i></span>${x.counts.loaded}/${x.max_guests}</td>
          <td class="r">${gate}</td>
          <td class="r">${tbl}</td>
        </tr>`;
        if (expanded.has(x.id)) {
          const grows = (x.guests || []).map((g, i) => `
            <tr><td class="n">${i + 1}</td>
                <td>${esc(g.name)}</td>
                <td><span class="dot ${g.gate_scanned_at ? 'on-g' : 'off'}">${g.gate_scanned_at ? 'P' : '·'}</span>
                    <span class="dot ${g.table_scanned_at ? 'on-t' : 'off'}">${g.table_scanned_at ? 'M' : '·'}</span></td>
            </tr>`).join('') || `<tr><td colspan="3" style="color:var(--text-muted);padding:8px 10px;">Sin invitados cargados.</td></tr>`;
          html += `<tr class="guests"><td colspan="5"><table class="glist"><tbody>${grows}</tbody></table></td></tr>`;
        }
        return html;
      }).join('');
      document.getElementById('tb').innerHTML = rows || `<tr><td colspan="5" style="padding:20px;color:var(--text-muted);">Sin resultados.</td></tr>`;
    }

    function toggle(id) { expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); }

    async function sendUndistributed() {
      const noMail = tables.filter(x => !x.manager_email).length;
      const ready = tables.filter(x => x.manager_email && x.counts.loaded < x.max_guests).length;
      if (!confirm(`Se enviarán por correo los pases NO repartidos a ${ready} titular(es) con correo.\n${noMail} mesa(s) sin correo se omiten.\n\n¿Continuar?`)) return;
      const btn = document.getElementById('send-btn');
      btn.disabled = true; btn.textContent = 'Enviando…';
      try {
        const r = await API.post(`/api/events/${slug}/invite-links/send-undistributed`, {});
        document.getElementById('send-result').textContent =
          `Listo: ${r.passes_sent} pase(s) enviados a ${r.tables_processed} mesa(s).` +
          (r.tables && r.tables.length ? '\n' + r.tables.map(t => `· ${t.table}: ${t.error ? 'ERROR ' + t.error : t.passes + ' → ' + t.to}`).join('\n') : '');
        await load();
      } catch (e) {
        document.getElementById('send-result').textContent = 'Error: ' + e.message;
      } finally {
        btn.disabled = false; btn.textContent = 'Enviar pases faltantes a titulares';
      }
    }

    document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });
    document.getElementById('incomplete').addEventListener('change', e => { onlyIncomplete = e.target.checked; render(); });

    init();
  </script>
</body>
</html>
