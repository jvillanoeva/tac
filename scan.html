<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <title>Scanner — Colectivo</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .scanner-page {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      text-align: center;
    }
    .scanner-header {
      margin-bottom: 24px;
    }
    .scanner-header h1 { font-size: 1.25rem; }
    #scanner-container {
      width: 100%;
      aspect-ratio: 1;
      max-width: 360px;
      margin: 0 auto 24px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 2px solid var(--border);
      background: #000;
    }
    #scanner-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .scanner-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 24px;
    }
    .scanner-stat {
      text-align: center;
    }
    .scanner-stat .value {
      font-size: 1.5rem;
      font-weight: 700;
    }
    .scanner-stat .label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Stage toggle: main gate vs table door */
    .mode-toggle {
      display: flex;
      gap: 0;
      max-width: 360px;
      margin: 0 auto 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .mode-toggle button {
      flex: 1;
      padding: 10px 8px;
      background: transparent;
      border: 0;
      border-right: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .mode-toggle button:last-child { border-right: 0; }
    .mode-toggle button.active { background: var(--text-primary, #fff); color: #000; }
    .result-table {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .result-table .rt-label { font-size: 1.6rem; font-weight: 800; letter-spacing: 1px; }
    .result-table .rt-manager { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

    /* Result overlay */
    .result-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms;
      background: rgba(0,0,0,0.85);
    }
    .result-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .result-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 48px 32px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      border: 3px solid var(--border);
    }
    .result-card.success { border-color: var(--success); }
    .result-card.warning { border-color: var(--warning); }
    .result-card.error { border-color: var(--danger); }
    .result-icon { font-size: 56px; margin-bottom: 16px; }
    .result-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
    .result-tier { font-size: 13px; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; margin-bottom: 8px; }
    .result-notes { color: var(--text-secondary); font-size: 14px; margin-bottom: 8px; }
    .result-message { color: var(--text-secondary); font-size: 14px; }
    .result-stats { margin-top: 16px; font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="scanner-page">
    <div class="scanner-header">
      <a href="/dashboard.html" class="nav-brand" style="display:block;margin-bottom:16px;">TAC</a>
      <h1 id="event-name">Scanner</h1>
      <p class="text-sm text-secondary" id="event-meta"></p>
    </div>

    <div class="mode-toggle">
      <button id="mode-gate" class="active" onclick="setMode('gate')">Puerta principal</button>
      <button id="mode-table" onclick="setMode('table')">Puerta de mesa</button>
    </div>
    <div id="door-label" class="hidden" style="text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;letter-spacing:2px;color:var(--accent);border:1px solid var(--accent);border-radius:var(--radius,6px);padding:9px;margin-bottom:20px;text-transform:uppercase;"></div>

    <div class="scanner-stats">
      <div class="scanner-stat">
        <div class="value" id="stat-in">—</div>
        <div class="label">Dentro</div>
      </div>
      <div class="scanner-stat">
        <div class="value" id="stat-total">—</div>
        <div class="label">Total</div>
      </div>
    </div>

    <div id="scanner-container"></div>

    <button class="btn" onclick="window.location.href='/guestlist.html?slug=' + slug" style="margin-top:8px">
      Ver lista completa
    </button>
  </div>

  <!-- Result overlay -->
  <div class="result-overlay" id="result-overlay" onclick="dismissResult()">
    <div class="result-card" id="result-card">
      <div class="result-icon" id="result-icon"></div>
      <div class="result-name" id="result-name"></div>
      <div class="result-tier" id="result-tier"></div>
      <div class="result-notes" id="result-notes"></div>
      <div class="result-message" id="result-message"></div>
      <div class="result-stats" id="result-stats"></div>
      <div class="result-table" id="result-table" style="display:none;">
        <div class="rt-label" id="rt-label"></div>
        <div class="rt-manager" id="rt-manager"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/api.js"></script>
  <script>
    Auth.init(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    API.init(CONFIG.API_URL);

    const slug = new URLSearchParams(window.location.search).get('slug');
    if (!slug) window.location.href = '/dashboard.html';

    let scanner = null;
    let isProcessing = false;
    let mode = 'gate'; // 'gate' = main gate (Foro GNP) · 'table' = table door

    function setMode(m) {
      mode = m;
      document.getElementById('mode-gate').classList.toggle('active', m === 'gate');
      document.getElementById('mode-table').classList.toggle('active', m === 'table');
    }

    // ?stage=gate|table locks the scanner to one door and hides the toggle, so
    // a door device can't accidentally check people in at the wrong door.
    const lockStage = new URLSearchParams(window.location.search).get('stage');
    if (lockStage === 'gate' || lockStage === 'table') {
      mode = lockStage;
      const tg = document.querySelector('.mode-toggle');
      if (tg) tg.style.display = 'none';
      const dl = document.getElementById('door-label');
      if (dl) { dl.textContent = lockStage === 'gate' ? 'Puerta principal' : 'Puerta de mesa'; dl.classList.remove('hidden'); }
    }

    async function init() {
      await Auth.requireSession();

      // Load event info
      try {
        const event = await API.get(`/api/events/${slug}`);
        document.getElementById('event-name').textContent = event.name;
        document.getElementById('event-meta').textContent =
          [event.date_label, event.venue].filter(Boolean).join(' · ');
        document.getElementById('stat-in').textContent = event.stats?.checked_in || 0;
        document.getElementById('stat-total').textContent = event.stats?.total_guests || 0;
      } catch (err) {
        document.getElementById('event-name').textContent = 'Error: ' + err.message;
      }

      startScanner();
    }

    function startScanner() {
      // Use the phone's native BarcodeDetector when available (orders of
      // magnitude faster than the JS fallback, and copes far better with dense
      // QRs), and only look for QR codes so no cycles are wasted on other
      // formats. Works on already-issued QRs — no reissue needed.
      const formats = (typeof Html5QrcodeSupportedFormats !== 'undefined')
        ? [Html5QrcodeSupportedFormats.QR_CODE]
        : undefined;
      scanner = new Html5Qrcode('scanner-container', {
        formatsToSupport: formats,
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      });
      scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          // Scan box sized to 75% of the smaller video dimension so the whole
          // QR fits inside it (a fixed box can be smaller than the code when
          // held close, leaving the decoder only a fragment).
          qrbox: (vw, vh) => { const s = Math.floor(Math.min(vw, vh) * 0.75); return { width: s, height: s }; },
          aspectRatio: 1.0,
          disableFlip: true,
        },
        onScanSuccess,
        () => {}
      ).catch(err => {
        document.getElementById('scanner-container').innerHTML =
          `<div style="padding:32px;color:var(--text-secondary);">
            <p>No se pudo acceder a la cámara</p>
            <p class="text-xs mt-8">${err}</p>
          </div>`;
      });
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      try {
        const result = await API.post('/api/checkin', { token: decodedText, stage: mode });
        showResult(result);
      } catch (err) {
        showResult({
          status: 'invalid',
          message: err.message,
          guest: { name: 'Error' },
        });
      }
    }

    function showResult(result) {
      const overlay = document.getElementById('result-overlay');
      const card = document.getElementById('result-card');

      card.className = 'result-card';

      if (result.status === 'success') {
        card.classList.add('success');
        document.getElementById('result-icon').textContent = '✓';
        document.getElementById('result-name').textContent = result.guest.name;
        document.getElementById('result-tier').textContent = result.guest.tier || '';
        document.getElementById('result-tier').style.color = result.guest.tier === 'VIP' ? '#f1c40f' : 'var(--text-muted)';
        document.getElementById('result-notes').textContent = result.guest.notes || '';
        document.getElementById('result-message').textContent = result.message;
        if (result.stats) {
          document.getElementById('result-stats').textContent =
            `${result.stats.checked_in} / ${result.stats.total}`;
          document.getElementById('stat-in').textContent = result.stats.checked_in;
          document.getElementById('stat-total').textContent = result.stats.total;
        }
      } else if (result.status === 'already_checked_in') {
        card.classList.add('warning');
        document.getElementById('result-icon').textContent = '⚠';
        document.getElementById('result-name').textContent = result.guest?.name || '';
        document.getElementById('result-tier').textContent = result.guest?.tier || '';
        document.getElementById('result-tier').style.color = result.guest?.tier === 'VIP' ? '#f1c40f' : 'var(--text-muted)';
        document.getElementById('result-notes').textContent = result.guest?.notes || '';
        document.getElementById('result-message').textContent = result.message;
        document.getElementById('result-stats').textContent = '';
      } else {
        card.classList.add('error');
        document.getElementById('result-icon').textContent = '✕';
        document.getElementById('result-name').textContent = '';
        document.getElementById('result-tier').textContent = '';
        document.getElementById('result-notes').textContent = '';
        document.getElementById('result-message').textContent = result.message;
        document.getElementById('result-stats').textContent = '';
      }

      // Table-door context: show table + account manager when available.
      const rt = document.getElementById('result-table');
      if (result.table && result.table.label) {
        document.getElementById('rt-label').textContent = result.table.label;
        document.getElementById('rt-manager').textContent =
          result.table.manager ? ('Titular: ' + result.table.manager) : '';
        rt.style.display = 'block';
      } else {
        rt.style.display = 'none';
      }

      overlay.classList.add('active');
    }

    function dismissResult() {
      document.getElementById('result-overlay').classList.remove('active');
      isProcessing = false;
    }

    init();
  </script>
</body>
</html>
