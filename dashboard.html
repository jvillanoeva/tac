<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <title>Dashboard — Colectivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    /* ── Match pnlm header ─────────────────────────────────────────── */
    .nav {
      height: 56px;
      padding: 0 32px;
      background: #111111;
      border-bottom: 1px solid #1f2937;
      border-top: none;
    }
    .nav-brand {
      font-family: 'Archivo Black', Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-transform: uppercase;
      text-decoration: none;
    }
    .nav-brand:hover { color: #ffffff; }
    .nav-links a, .nav-links a.active, .nav-links a:hover {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #6b7280;
      text-transform: none;
      letter-spacing: 0;
    }
    .nav-links a:hover { color: #9ca3af; }
    .nav-links a.active { color: #9ca3af; }
    .nav-user {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #4b5563;
    }

    /* ── Hero font ─────────────────────────────────────────────────── */
    /* Single rule: touch here to restyle all hero objects at once     */
    .hero {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 300;
      letter-spacing: 0;
    }

    /* ── Layout ────────────────────────────────────────────────────── */
    .event-card {
      border: 1px solid #1f2937;
      transition: border-color 120ms ease, background 120ms ease;
      position: relative;
    }
    .event-card:hover {
      border-color: #374151;
      background: #1a1a1a;
    }
    .event-card-link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      padding-right: 44px; /* leave room for kebab */
    }
    .event-thumb {
      width: 64px;
      height: 64px;
      object-fit: cover;
      background: #1a1a1a;
      flex-shrink: 0;
    }
    .event-info { flex: 1; min-width: 0; }
    .event-name {
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
    }
    .event-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #6b7280;
      margin-top: 4px;
    }
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .event-menu-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      color: #4b5563;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
      z-index: 2;
      font-family: inherit;
      border-radius: 4px;
      transition: color 120ms, background 120ms;
    }
    .event-menu-btn:hover { color: #e5e7eb; background: rgba(255,255,255,0.04); }
    .event-menu {
      position: absolute;
      top: 40px;
      right: 12px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      z-index: 10;
      min-width: 160px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(-4px) scale(0.98);
      transform-origin: top right;
      pointer-events: none;
      transition: opacity 140ms ease, transform 140ms ease;
    }
    .event-menu.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .event-menu a, .event-menu button {
      display: block;
      width: 100%;
      padding: 10px 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: #9ca3af;
      text-decoration: none;
      border: none;
      background: none;
      text-align: left;
      cursor: pointer;
    }
    .event-menu a:hover, .event-menu button:hover {
      background: #222;
      color: #fff;
    }
    .event-menu button.danger { color: #ef4444; }
    .event-menu button.danger:hover { background: #1c1010; color: #f87171; }
    .section-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #4b5563;
      margin-bottom: 8px;
      margin-top: 32px;
    }
    .section-label:first-child { margin-top: 0; }
    /* ── List/calendar toggle + month grid ─────────────────────────── */
    .view-toggle { display: flex; gap: 2px; margin-bottom: 16px; }
    .view-toggle button {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      padding: 6px 14px;
      background: none;
      border: 1px solid #1f2937;
      color: #6b7280;
      cursor: pointer;
      transition: color 120ms, border-color 120ms;
    }
    .view-toggle button:hover { color: #9ca3af; }
    .view-toggle button.active { color: #ffffff; border-color: #4b5563; }
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .cal-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: #e5e7eb;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      min-width: 160px;
      text-align: center;
    }
    .cal-nav {
      background: none;
      border: 1px solid #1f2937;
      color: #6b7280;
      font-size: 14px;
      width: 28px;
      height: 28px;
      cursor: pointer;
    }
    .cal-nav:hover { color: #e5e7eb; border-color: #374151; }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .cal-dow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: #4b5563;
      text-align: center;
      padding: 6px 0;
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .cal-cell {
      border: 1px solid #1f2937;
      min-height: 74px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .cal-cell.empty { border-color: transparent; }
    .cal-cell.today { border-color: #4b5563; background: #16181d; }
    .cal-cell.today .cal-day { color: #ffffff; }
    .cal-day {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: #4b5563;
    }
    .cal-chip {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      line-height: 1.3;
      color: #d1fae5;
      background: #123324;
      border: 1px solid #1c4a34;
      padding: 3px 5px;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cal-chip:hover { border-color: #34d399; }
    .cal-chip.draft {
      color: #9ca3af;
      background: #1a1a1a;
      border: 1px dashed #374151;
    }
    .cal-chip.draft:hover { border-color: #6b7280; }
    .btn-primary.hero {
      background: none;
      border: 1px solid #374151;
      color: #ffffff;
      padding: 8px 16px;
      font-size: 14px;
      text-decoration: none;
      transition: border-color 120ms ease, color 120ms ease;
    }
    .btn-primary.hero:hover {
      border-color: #6b7280;
      color: #ffffff;
      background: none;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div style="display:flex;align-items:center;gap:0">
      <a href="/dashboard.html" class="nav-brand">TAC</a>
      <span style="font-family:'IBM Plex Mono',monospace;color:#4b5563;margin:0 10px;font-size:13px">·</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:0.1em">Dashboard</span>
    </div>
    <div class="nav-links">
      <span class="nav-user" id="nav-email"></span>
      <a href="#" onclick="Auth.signOut()">salir</a>
    </div>
  </nav>

  <div class="container page">
    <div id="page-body">
      <div class="empty-state">
        <div class="spinner" style="margin:0 auto"></div>
      </div>
    </div>
  </div>

  <style>
    /* Big org-card grid (default view) */
    .orgs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }
    .org-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
      border: 1px solid #1f2937;
      text-decoration: none;
      color: inherit;
      transition: border-color 120ms, background 120ms;
      min-height: 140px;
      cursor: pointer;
    }
    .org-card:hover { border-color: #374151; background: #1a1a1a; }
    .org-card .logo-row { display: flex; align-items: center; gap: 12px; min-height: 36px; }
    .org-card .logo-row img {
      height: 36px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
    }
    .org-card .logo-row img.inverted { filter: invert(1); }
    .org-card .logo-row .placeholder {
      width: 32px; height: 32px;
      background: #1a1a1a;
      border: 1px solid #1f2937;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      color: #6b7280;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .org-card .name {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 18px;
      color: #ffffff;
      font-weight: 400;
      letter-spacing: -0.01em;
    }
    .org-card .meta {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: auto;
    }
    .org-card .type {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: #6b7280;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .org-card .count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #9ca3af;
    }
    .org-card.add-card {
      border-style: dashed;
      align-items: center;
      justify-content: center;
      color: #6b7280;
    }
    .org-card.add-card:hover { color: #e5e7eb; border-color: #4b5563; }

    /* Filter view breadcrumb */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
    }
    .breadcrumb a {
      color: #6b7280;
      text-decoration: none;
      letter-spacing: 0.1em;
    }
    .breadcrumb a:hover { color: #e5e7eb; }
    .breadcrumb .sep { color: #374151; }
    .breadcrumb .current { color: #e5e7eb; letter-spacing: 0.05em; }
    .filter-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .filter-header img { height: 44px; width: auto; max-width: 220px; object-fit: contain; display: block; }
    .filter-header img.inverted { filter: invert(1); }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/api.js"></script>
  <script>
    Auth.init(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    API.init(CONFIG.API_URL);

    async function loadDashboard() {
      const session = await Auth.requireSession();
      currentEmail = (session.user.email || '').toLowerCase();
      document.getElementById('nav-email').textContent = session.user.email;

      try {
        const [orgs, eventsResp] = await Promise.all([
          API.get('/api/orgs').catch(() => []),
          API.get('/api/events'),
        ]);
        const { owned = [], staffed = [], viaOrg = [] } = eventsResp;

        // Group events by org; collect standalone
        const allMyEvents = [...owned, ...viaOrg];
        const eventsByOrgId = new Map(); // org_id -> events[]
        const standalone = [];
        for (const ev of allMyEvents) {
          if (ev.organization_id) {
            if (!eventsByOrgId.has(ev.organization_id)) eventsByOrgId.set(ev.organization_id, []);
            eventsByOrgId.get(ev.organization_id).push(ev);
          } else {
            standalone.push(ev);
          }
        }

        const params = new URLSearchParams(location.search);
        const filter = params.get('org'); // slug, __standalone, __staff, or null

        if (!filter) {
          renderOrgListView({ orgs, eventsByOrgId, standalone, staffed });
        } else {
          renderFilterView({ filter, orgs, eventsByOrgId, standalone, staffed });
        }
      } catch (err) {
        document.getElementById('page-body').innerHTML = `
          <div class="empty-state">
            <h3>Error al cargar eventos</h3>
            <p class="text-secondary">${esc(err.message)}</p>
          </div>`;
      }
    }

    // Only these accounts may create organizations; everyone else sees just the
    // projects they've been assigned to.
    const ADMIN_EMAILS = ['jorge@ccoossmmoo.com', 'jvillanoeva@gmail.com'];
    let currentEmail = '';

    function renderOrgListView({ orgs, eventsByOrgId, standalone, staffed }) {
      const isAdmin = ADMIN_EMAILS.includes(currentEmail);

      // Non-admins (clients) skip the org layer entirely — show the projects
      // (events) they've been assigned to, directly.
      if (!isAdmin) {
        const myEvents = [];
        eventsByOrgId.forEach(list => myEvents.push(...list));
        standalone.forEach(e => myEvents.push(e));
        staffed.forEach(e => myEvents.push(e));
        const cards = myEvents
          .map(ev => renderEventCard(ev, ev.staff_role || null, ev.organizations && ev.organizations.slug))
          .join('');
        document.getElementById('page-body').innerHTML = `
          <div class="page-header"><h1 class="hero" style="font-size:28px;color:#ffffff">Proyectos</h1></div>
          ${myEvents.length === 0 ? `
            <div class="empty-state">
              <h3>Sin proyectos</h3>
              <p class="text-secondary">Aún no tienes proyectos asignados. Pide acceso al organizador.</p>
            </div>
          ` : `<div class="events-list">${cards}</div>`}`;
        return;
      }

      const orgCards = orgs.map(o => {
        const count = (eventsByOrgId.get(o.id) || []).length;
        return `
          <a href="/dashboard.html?org=${esc(o.slug)}" class="org-card">
            <div class="logo-row">
              ${o.logo_url ? `<img src="${esc(o.logo_url)}" alt="" class="${o.logo_invert ? 'inverted' : ''}">` : `<div class="placeholder">${esc((o.name || '?')[0].toUpperCase())}</div>`}
            </div>
            <div class="name">${esc(o.name)}</div>
            <div class="meta">
              <span class="type">${o.type === 'venue' ? 'venue' : 'promotor'}</span>
              <span class="count">${count} ${count === 1 ? 'evento' : 'eventos'}</span>
            </div>
          </a>
        `;
      }).join('');

      const syntheticCards = [];
      if (standalone.length > 0) {
        syntheticCards.push(`
          <a href="/dashboard.html?org=__standalone" class="org-card">
            <div class="logo-row"><div class="placeholder">·</div></div>
            <div class="name">Independientes</div>
            <div class="meta"><span class="count">${standalone.length} ${standalone.length === 1 ? 'evento' : 'eventos'}</span></div>
          </a>
        `);
      }
      if (staffed.length > 0) {
        syntheticCards.push(`
          <a href="/dashboard.html?org=__staff" class="org-card">
            <div class="logo-row"><div class="placeholder">★</div></div>
            <div class="name">Como staff</div>
            <div class="meta"><span class="count">${staffed.length} ${staffed.length === 1 ? 'evento' : 'eventos'}</span></div>
          </a>
        `);
      }

      const html = `
        <div class="page-header">
          <h1 class="hero" style="font-size:28px;color:#ffffff">Proyectos</h1>
          ${isAdmin ? `<a href="/org-editor.html" class="btn btn-sm hero" style="font-size:12px;">+ Nueva</a>` : ''}
        </div>
        ${orgs.length === 0 && standalone.length === 0 && staffed.length === 0 ? `
          <div class="empty-state">
            ${isAdmin ? `
              <h3>Bienvenido</h3>
              <p class="text-secondary">Crea una organización para empezar.</p>
              <a href="/org-editor.html" class="btn btn-primary mt-24">+ Nueva organización</a>
            ` : `
              <h3>Sin proyectos</h3>
              <p class="text-secondary">Aún no tienes proyectos asignados. Pide acceso al organizador.</p>
            `}
          </div>
        ` : `
          <div class="orgs-grid">
            ${orgCards}
            ${syntheticCards.join('')}
          </div>
        `}
      `;
      document.getElementById('page-body').innerHTML = html;
    }

    function renderFilterView({ filter, orgs, eventsByOrgId, standalone, staffed }) {
      let title, subtitle, logoUrl, logoInvert = false, events, orgSlug = null, extraActions = '';

      if (filter === '__standalone') {
        title = 'Independientes';
        subtitle = 'Eventos sin organización';
        events = standalone;
      } else if (filter === '__staff') {
        title = 'Como staff';
        subtitle = 'Eventos de otras organizaciones donde colaboras';
        events = staffed;
      } else {
        const org = orgs.find(o => o.slug === filter);
        if (!org) {
          document.getElementById('page-body').innerHTML = `
            <div class="breadcrumb"><a href="/dashboard.html">← Organizaciones</a></div>
            <div class="empty-state"><h3>Organización no encontrada</h3></div>`;
          return;
        }
        title = org.name;
        subtitle = org.type === 'venue' ? 'Venue' : 'Promotor';
        logoUrl = org.logo_url;
        logoInvert = !!org.logo_invert;
        events = eventsByOrgId.get(org.id) || [];
        orgSlug = org.slug;
        extraActions = `
          <a href="/org-editor.html?slug=${esc(org.slug)}" class="btn hero">Editar organización</a>
          <a href="/${esc(org.slug)}" target="_blank" class="btn hero">Ver pública →</a>
        `;
      }

      const newEventHref = orgSlug
        ? `/event-editor.html?org=${esc(orgSlug)}`
        : `/event-editor.html`;

      const html = `
        <div class="breadcrumb">
          <a href="/dashboard.html">← Organizaciones</a>
          <span class="sep">/</span>
          <span class="current">${esc(title)}</span>
        </div>
        <div class="filter-header">
          ${logoUrl ? `<img src="${esc(logoUrl)}" alt="" class="${logoInvert ? 'inverted' : ''}">` : ''}
          <div style="flex:1">
            <h1 class="hero" style="font-size:28px;color:#ffffff;margin:0;">${esc(title)}</h1>
            <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6b7280;letter-spacing:0.18em;text-transform:uppercase;margin-top:4px;">${esc(subtitle)}</div>
          </div>
          <div style="display:flex;gap:8px;">
            ${extraActions}
            <a href="${newEventHref}" class="btn btn-primary hero">+ Nuevo evento</a>
          </div>
        </div>
        ${events.length === 0 ? `
          <div class="empty-state">
            <h3>Sin eventos aún</h3>
            <p class="text-secondary">Crea el primero para empezar.</p>
            <a href="${newEventHref}" class="btn btn-primary mt-24">+ Nuevo evento</a>
          </div>
        ` : `
          <div class="view-toggle">
            <button id="vt-list" onclick="setEventsView('list')">Lista</button>
            <button id="vt-cal" onclick="setEventsView('cal')">Calendario</button>
          </div>
          <div id="events-body"></div>
        `}
      `;
      document.getElementById('page-body').innerHTML = html;
      if (events.length > 0) {
        viewState = { events, filter, orgSlug };
        renderEventsBody();
      }
    }

    // ── List / calendar view of an org's events ─────────────────────────
    let viewState = null;                      // { events, filter, orgSlug }
    let calMonth = null;                       // Date pinned to the 1st of the shown month

    function setEventsView(v) {
      localStorage.setItem('tac_events_view', v);
      if (v === 'list') calMonth = null;       // reset so the calendar reopens on today
      renderEventsBody();
    }

    function eventDate(ev) {
      // Real date if set; created_at keeps undated legacy events visible.
      return new Date(ev.date || ev.created_at);
    }

    function renderEventsBody() {
      const view = localStorage.getItem('tac_events_view') || 'list';
      document.getElementById('vt-list').classList.toggle('active', view === 'list');
      document.getElementById('vt-cal').classList.toggle('active', view === 'cal');
      const el = document.getElementById('events-body');
      const { events, filter, orgSlug } = viewState;

      if (view === 'list') {
        const sorted = [...events].sort((a, b) => eventDate(b) - eventDate(a));
        el.innerHTML = `<div class="events-list">
          ${sorted.map(ev => renderEventCard(ev, filter === '__staff' ? ev.staff_role : null, orgSlug)).join('')}
        </div>`;
        return;
      }
      el.innerHTML = renderCalendar(events, orgSlug);
    }

    function shiftMonth(delta) {
      calMonth.setMonth(calMonth.getMonth() + delta);
      renderEventsBody();
    }

    function renderCalendar(events, orgSlug) {
      const now = new Date();
      if (!calMonth) calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      const y = calMonth.getFullYear(), m = calMonth.getMonth();

      // Events keyed by day of the shown month
      const byDay = {};
      for (const ev of events) {
        const d = eventDate(ev);
        if (d.getFullYear() === y && d.getMonth() === m) {
          (byDay[d.getDate()] = byDay[d.getDate()] || []).push(ev);
        }
      }

      const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
      const DOW = ['L','M','X','J','V','S','D'];
      const firstDow = (new Date(y, m, 1).getDay() + 6) % 7;   // Monday-first
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const isThisMonth = now.getFullYear() === y && now.getMonth() === m;

      let cells = '';
      for (let i = 0; i < firstDow; i++) cells += '<div class="cal-cell empty"></div>';
      for (let d = 1; d <= daysInMonth; d++) {
        const todayCls = isThisMonth && d === now.getDate() ? ' today' : '';
        const chips = (byDay[d] || []).map(ev => {
          const href = orgSlug === 'lost-nights'
            ? `/supervisor.html?slug=${ev.slug}`
            : `/guestlist.html?slug=${ev.slug}`;
          return `<a class="cal-chip${ev.published ? '' : ' draft'}" href="${href}" title="${esc(ev.name)}${ev.published ? '' : ' (borrador)'}">${esc(ev.name)}</a>`;
        }).join('');
        cells += `<div class="cal-cell${todayCls}"><div class="cal-day">${d}</div>${chips}</div>`;
      }

      return `
        <div class="cal-head">
          <button class="cal-nav" onclick="shiftMonth(-1)">‹</button>
          <span class="cal-title">${MONTHS[m]} ${y}</span>
          <button class="cal-nav" onclick="shiftMonth(1)">›</button>
        </div>
        <div class="cal-grid">
          ${DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}
          ${cells}
        </div>`;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }

    function renderEventCard(ev, staffRole, orgSlug) {
      // Lost Nights operates from the supervisor (tables) view; other orgs keep the guestlist.
      const primaryHref = orgSlug === 'lost-nights'
        ? `/supervisor.html?slug=${ev.slug}`
        : `/guestlist.html?slug=${ev.slug}`;
      const thumb = ev.banner_url
        ? `<img src="${ev.banner_url}" class="event-thumb" alt="">`
        : `<div class="event-thumb"></div>`;

      const badge = ev.published
        ? '<span class="badge badge-success">Publicado</span>'
        : '<span class="badge badge-muted">Borrador</span>';

      const roleLabel = staffRole
        ? `<span class="badge badge-warning" style="margin-left:8px">${staffRole}</span>`
        : '';

      const isAdmin = ADMIN_EMAILS.includes(currentEmail);
      const menu = !staffRole ? `
        <button class="event-menu-btn" onclick="event.preventDefault();event.stopPropagation();toggleMenu('${ev.slug}')">&#8942;</button>
        <div class="event-menu" id="menu-${ev.slug}">
          <a href="/event-editor.html?slug=${ev.slug}">Editar</a>
          <button onclick="event.preventDefault();duplicateEvent('${ev.slug}', '${ev.name.replace(/'/g, "\\'")}')">Duplicar</button>
          <a href="/guestlist.html?slug=${ev.slug}">Guestlist</a>
          <a href="/supervisor.html?slug=${ev.slug}">Supervisor</a>
          <a href="/scan.html?slug=${ev.slug}">Scanner</a>
          ${isAdmin ? `<button class="danger" onclick="event.preventDefault();deleteEvent('${ev.slug}', '${ev.name.replace(/'/g, "\\'")}')">Eliminar</button>` : ''}
        </div>
      ` : '';

      return `
        <div class="event-card">
          <a href="${primaryHref}" class="event-card-link">
            ${thumb}
            <div class="event-info">
              <div class="event-name hero">${ev.name}</div>
              <div class="event-meta">
                ${ev.date_label || ''}${ev.venue ? ' · ' + ev.venue : ''}
              </div>
              <div class="mt-8">${badge}${roleLabel}</div>
            </div>
          </a>
          ${menu}
        </div>`;
    }

    function toggleMenu(slug) {
      // Close all other menus
      document.querySelectorAll('.event-menu.open').forEach(m => {
        if (m.id !== 'menu-' + slug) m.classList.remove('open');
      });
      document.getElementById('menu-' + slug).classList.toggle('open');
    }

    // Close menus on outside click
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.event-menu-btn') && !e.target.closest('.event-menu')) {
        document.querySelectorAll('.event-menu.open').forEach(m => m.classList.remove('open'));
      }
    });

    // Duplicate an event's settings onto a new date. The copy starts as
    // Borrador (unpublished); we jump straight to the editor to swap the flyer.
    async function duplicateEvent(slug, name) {
      const today = new Date();
      const pad = n => String(n).padStart(2, '0');
      const defaultDate = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
      const date = prompt(`Duplicar "${name}"\n\nFecha del nuevo evento (YYYY-MM-DD):`, defaultDate);
      if (!date) return;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date.trim())) {
        alert('Formato de fecha inválido. Usa YYYY-MM-DD.');
        return;
      }
      try {
        const copy = await API.post(`/api/events/${slug}/duplicate`, { date: date.trim() });
        if (copy.notes && copy.notes.length) alert(copy.notes.join('\n'));
        location.href = `/event-editor.html?slug=${copy.slug}`;
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    async function deleteEvent(slug, name) {
      if (!confirm(`¿Eliminar "${name}"?\n\nSe borrarán también invitados, staff y enlaces de invitación.\nNo se puede deshacer.`)) return;
      try {
        await API.del(`/api/events/${slug}`);
        await loadDashboard();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    loadDashboard();
  </script>
</body>
</html>
